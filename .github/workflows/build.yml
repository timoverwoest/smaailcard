name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  style:
    name: Style (Prettier and ESLint of the Home Assistant frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The versions the Home Assistant frontend uses. Only for this check, so
      # they stay out of package.json and the lock file.
      - name: Install Prettier and ESLint
        run: >-
          npm install --no-save --no-package-lock
          prettier@3.10.1
          eslint@10.15.0
          @eslint/js@10.0.1
          globals@17.14.0
          typescript-eslint@8.73.0
          eslint-config-prettier@10.1.8
          eslint-plugin-lit@2.3.1
          eslint-plugin-lit-a11y@5.1.3
          eslint-plugin-wc@3.1.0
          eslint-plugin-import-x@4.18.1
          eslint-plugin-unused-imports@4.4.1
          @html-eslint/eslint-plugin@0.68.0
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
