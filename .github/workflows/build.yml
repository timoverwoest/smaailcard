name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Tests (Vitest, as in the Home Assistant frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # De versies van de Home Assistant-frontend; alleen voor deze controle, dus
      # niet in package.json of de lockfile. Vitest 5 vraagt Vite 6.4 of nieuwer;
      # de build-job houdt de Vite uit de lockfile.
      - name: Install Vitest
        run: npm install --no-save --no-package-lock vitest@5.1.1 vite@8.3.8
      - run: npm test

  style:
    name: Style (Prettier and ESLint of the Home Assistant frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # De versies van de Home Assistant-frontend. Alleen voor deze controle, dus
      # niet in package.json of de lockfile.
      - name: Install Prettier and ESLint
        run: >-
          npm install --no-save --no-package-lock
          prettier@3.10.1
          eslint@10.15.0
          @eslint/js@10.0.1
          globals@17.14.0
          typescript-eslint@8.73.0
          eslint-config-prettier@10.1.8
          eslint-plugin-lit@2.3.1
          eslint-plugin-lit-a11y@5.1.3
          eslint-plugin-wc@3.1.0
          eslint-plugin-import-x@4.18.1
          eslint-plugin-unused-imports@4.4.1
          @html-eslint/eslint-plugin@0.68.0
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
