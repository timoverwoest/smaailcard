name: Release

# Handmatig te starten vanaf de Actions-tab: vul een versienummer in en deze
# workflow zet de versie in package.json en src/const.ts, bouwt de bundel,
# commit die, en maakt de tag + GitHub Release met dist/smaailcard.js als
# asset (dat is wat HACS het liefst binnenhaalt).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versienummer zonder "v", bijvoorbeeld 0.2.0'
        required: true
        type: string
      prerelease:
        description: "Als pre-release publiceren"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags meenemen, zodat we op duplicaten kunnen checken

      # Invoer via env i.p.v. rechtstreekse interpolatie in de shell, zodat de
      # waarde nooit als script wordt uitgevoerd.
      - name: Versie controleren
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Ongeldige versie '$VERSION' — verwacht bijv. 0.2.0, zonder 'v'."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION bestaat al."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Versie doorvoeren
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s|^export const CARD_VERSION = .*|export const CARD_VERSION = \"$VERSION\";|" src/const.ts
          grep -q "CARD_VERSION = \"$VERSION\";" src/const.ts \
            || { echo "::error::CARD_VERSION niet bijgewerkt in src/const.ts"; exit 1; }

      - run: npm run build

      - name: Bundel controleren
        run: test -s dist/smaailcard.js

      - name: Versiebump committen
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/const.ts dist/smaailcard.js
          if git diff --cached --quiet; then
            echo "Niets gewijzigd, commit overgeslagen."
          else
            git commit -m "Release v$VERSION"
            # Push met GITHUB_TOKEN triggert geen workflows, dus dit start
            # de Build-workflow niet opnieuw.
            git push origin "HEAD:$BRANCH"
          fi

      - name: Tag en release aanmaken
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "v$VERSION" --generate-notes --target "$(git rev-parse HEAD)")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "v$VERSION" dist/smaailcard.js "${args[@]}"
          echo "Release v$VERSION aangemaakt." >> "$GITHUB_STEP_SUMMARY"
